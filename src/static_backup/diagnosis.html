<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <title>服务诊断</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css?v=n9" rel="stylesheet">
  <style>
    body { 
      font-family: 'Microsoft YaHei', sans-serif; 
      background-color: #f8f9fa;
      padding: 0;
      margin: 0;
    }
    .card {
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
      border: none;
    }
    .card-header {
      background-color: #fff;
      border-bottom: 1px solid rgba(0, 0, 0, 0.125);
      font-weight: bold;
    }
    .btn-primary {
      background-color: #6f42c1;
      border-color: #6f42c1;
    }
    .btn-primary:hover {
      background-color: #5a32a3;
      border-color: #5a32a3;
    }
    .navbar-brand {
      font-weight: bold;
    }
    h1 {
      color: #6f42c1;
    }
    #result { 
      height: calc(100vh - 250px);
      overflow: auto;
      background: #f8f9fa;
      padding: 15px;
      border: 1px solid #dee2e6;
      border-radius: 0.375rem;
      font-family: monospace;
    }
    .container {
      max-width: 100%;
      padding: 15px;
    }
    .navbar {
      margin-bottom: 0 !important;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">🔍 服务诊断</a>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <div class="card-body">
        <div class="d-grid gap-2 d-md-flex justify-content-md-start">
          <button class="btn btn-primary me-md-2" type="button" onclick="runDiagnosis()">
            运行诊断
          </button>
          <button class="btn btn-secondary" type="button" onclick="clearResult()">
            清空结果
          </button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        诊断结果
      </div>
      <div class="card-body">
        <div id="result">点击"运行诊断"按钮开始诊断...</div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js?v=n9"></script>
  <script>
    async function runDiagnosis() {
      const resultEl = document.getElementById('result');
      resultEl.textContent = '正在运行诊断...';
      
      try {
        const response = await fetch('/api/diagnosis');
        const result = await response.text();
        resultEl.innerHTML = result;
      } catch (e) {
        resultEl.textContent = '诊断执行失败: ' + e.message;
      }
    }
    
    function clearResult() {
      document.getElementById('result').textContent = '';
    }
  </script>
</body>
</html>
