<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网关控制台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="text-center mb-4">
        <h1 class="display-6">Adapter Gateway Console</h1>
        <p class="text-muted">OpenAI Chat Completion 兼容的 FastAPI 接口。</p>
    </div>
    <div class="row g-3">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title">主要接口</h5>
                    <ul class="list-unstyled">
                        <li><strong>GET</strong> <code>/v1/models</code></li>
                        <li><strong>POST</strong> <code>/v1/chat/completions</code></li>
                        <li><strong>GET</strong> <code>/health</code></li>
                    </ul>
                    <p class="text-muted small mb-0">可通过任何 OpenAI 兼容客户端直连（ASTR、NoneBot、Napcat 等）。</p>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title">链接</h5>
                    <p class="mb-1"><a class="btn btn-sm btn-outline-primary" href="/v1/models" target="_blank">查看模型列表</a></p>
                    <p class="mb-1"><a class="btn btn-sm btn-outline-secondary" href="/docs" target="_blank">Swagger 文档</a></p>
                    <p class="text-muted small mb-0">默认监听端口来自 data/config.json 中的 unified_api 设置。</p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
