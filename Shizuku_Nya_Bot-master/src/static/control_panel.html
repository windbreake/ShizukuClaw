<div class="tab-pane fade show active" id="v-dashboard" role="tabpanel">
    <div class="dashboard-container">
        <div class="row g-4 mb-4">
            <!-- 快速对话 -->
            <div class="col-md-3">
                <div class="card text-center h-100 py-3 pointer border-0 shadow-sm" onclick="document.getElementById('v-sandbox-tab').click()">
                    <div class="card-body">
                        <i class="fas fa-paper-plane fa-2x text-primary mb-3"></i>
                        <h6 class="card-title text-dark fw-bold">快速对话</h6>
                        <p class="card-text text-muted small mb-0">进入沙箱测试环境</p>
                    </div>
                </div>
            </div>
            <!-- 系统诊断 -->
            <div class="col-md-3">
                <div class="card text-center h-100 py-3 pointer border-0 shadow-sm" onclick="document.getElementById('v-env-tab').click()">
                    <div class="card-body">
                        <i class="fas fa-microchip fa-2x text-success mb-3"></i>
                        <h6 class="card-title text-dark fw-bold">系统诊断</h6>
                        <p class="card-text text-muted small mb-0">运行自检程序</p>
                    </div>
                </div>
            </div>
            <!-- 配置中心 -->
            <div class="col-md-3">
                <div class="card text-center h-100 py-3 pointer border-0 shadow-sm" onclick="document.getElementById('v-config-tab').click()">
                    <div class="card-body">
                        <i class="fas fa-tools fa-2x text-info mb-3"></i>
                        <h6 class="card-title text-dark fw-bold">配置中心</h6>
                        <p class="card-text text-muted small mb-0">修改核心参数</p>
                    </div>
                </div>
            </div>
            <!-- 查看日志 -->
            <div class="col-md-3">
                <div class="card text-center h-100 py-3 pointer border-0 shadow-sm" onclick="document.getElementById('v-logs-tab').click()">
                    <div class="card-body">
                        <i class="fas fa-list-alt fa-2x text-warning mb-3"></i>
                        <h6 class="card-title text-dark fw-bold">查看日志</h6>
                        <p class="card-text text-muted small mb-0">诊断问题</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div class="row g-4">
            <div class="col-md-8">
                <div class="card h-100 shadow-sm border-0 fade-in">
                    <div class="card-header bg-white border-bottom-0 pt-3 pb-0 d-flex justify-content-between align-items-center">
                        <span class="fw-bold"><i class="fas fa-chart-line me-2"></i> 实时资源流</span>
                        <span class="badge bg-success rounded-pill" id="sys-status-badge">Running</span>
                    </div>
                    <div class="card-body">
                        <div style="height: 300px;"> <!-- 减少图表高度 -->
                            <canvas id="mainChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 shadow-sm border-0 fade-in">
                    <div class="card-header bg-white border-bottom-0 pt-3 pb-0">
                        <span class="fw-bold"><i class="fas fa-info-circle me-2"></i> 系统摘要</span>
                    </div>
                    <div class="card-body">
                        <ul class="list-group list-group-flush mb-3">
                            <li class="list-group-item d-flex justify-content-between align-items-center border-0 px-0 py-2">
                                <span class="text-secondary small"><i class="fas fa-microchip me-2"></i>CPU Load</span>
                                <span class="badge bg-danger rounded-pill" id="dash-cpu">0%</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center border-0 px-0 py-2">
                                <span class="text-secondary small"><i class="fas fa-memory me-2"></i>RAM Usage</span>
                                <span class="badge bg-primary rounded-pill" id="dash-mem">0%</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center border-0 px-0 py-2">
                                <span class="text-secondary small"><i class="fas fa-coins me-2"></i>Total Tokens</span>
                                <span class="text-dark fw-bold small" id="dash-token">0</span>
                            </li>
                        </ul>

                        <div class="row align-items-center g-0 bg-light rounded p-2 mb-3">
                            <div class="col-5 position-relative text-center" style="height: 80px;">
                                <canvas id="diskChart"></canvas>
                            </div>
                            <div class="col-7 ps-3 border-start">
                                <div class="d-flex justify-content-between small mb-1">
                                    <span class="text-muted">OS:</span>
                                    <span id="sys-platform" class="text-dark fw-bold text-truncate" style="max-width: 80px;">-</span>
                                </div>
                                <div class="d-flex justify-content-between small mb-1">
                                    <span class="text-muted">Python:</span>
                                    <span id="sys-python" class="text-dark fw-bold">-</span>
                                </div>
                                <div class="d-flex justify-content-between small">
                                    <span class="text-muted">System Uptime:</span>
                                    <span id="system-uptime" class="text-dark fw-bold">-</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
