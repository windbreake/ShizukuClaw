name: Python CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            flask \
            fastapi \
            uvicorn \
            websockets \
            openai \
            mysql-connector-python \
            pillow \
            colorama \
            requests \
            psutil \
            Werkzeug \
            python-dotenv \
            apscheduler \
            pytest \
            pytest-benchmark \
            pylint \
            beautifulsoup4

      - name: Syntax check (compileall)
        run: python -m compileall -q .

      - name: Run pytest
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Run pylint (errors only)
        env:
          PYTHONPATH: .
        run: python -m pylint --errors-only src tests *.py
